name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/premium-wedding-site-957r9a
      - main
  workflow_dispatch:

# Least privilege that still lets the Pages deployment run.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queue rather than cancel a run that is publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Project pages live at /<repo>/ — set to '/' for a custom domain.
          BASE_PATH: /faiz-marriage/

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository the first time this runs.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
